<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3470f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bhajana">
<title>Ayyappa Bhajana Songs</title>
<style>
  body { margin:0; font-family: "Noto Sans Telugu", system-ui, sans-serif; background:#fff7ec; color:#2b1b0e; }
  header { background:#b3470f; color:#fff; padding:1rem; text-align:center; }
  header h1 { margin:0; font-size:1.5rem; }
  /* Stacked layout: song index on top, lyrics below it. */
  .wrap { max-width:760px; margin:auto; }
  nav { padding:1rem; }
  main { padding:1rem; border-top:2px solid #f0d2ae; scroll-margin-top:0; }
  /* God picture / emblem faintly behind the lyrics (fixed, so it stays while the lyrics scroll). */
  #godBg { position:fixed; inset:12vh 4vw 14vh; z-index:-1; pointer-events:none; opacity:0;
           background:center / contain no-repeat; transition:opacity .4s; }
  body:not(.home) #godBg.ready { opacity:var(--bg-opacity, .12); }
  #godBg.photo { inset:4vh 2vw 8vh; }               /* photos: a bit larger, still whole (not cropped) */
  /* "Songs" tab on the middle of the left edge: shown while reading lyrics; tap it and the
     song index slides out from the left as a drawer. */
  #toIndex { position:fixed; left:0; top:50%; transform:translateY(-50%); z-index:5; display:none;
             padding:.8rem .45rem; padding-left:calc(.45rem + env(safe-area-inset-left));
             border:0; border-radius:0 12px 12px 0; background:#b3470f; color:#fff; font-size:1rem; line-height:1.1;
             box-shadow:2px 0 10px rgba(0,0,0,.25); cursor:pointer; touch-action:manipulation; text-align:center; }
  #toIndex .vt { writing-mode:vertical-rl; display:inline-block; margin-top:.3rem; letter-spacing:.05em; }
  body.show-to-index #toIndex { display:block; }
  #scrim { position:fixed; inset:0; z-index:19; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .25s; }
  #drawer { position:fixed; top:0; bottom:0; left:0; z-index:20; width:min(85vw, 340px); background:#fff7ec;
            transform:translateX(-105%); transition:transform .25s ease; box-shadow:4px 0 16px rgba(0,0,0,.25);
            display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); padding-left:env(safe-area-inset-left); }
  body.drawer-open #drawer { transform:translateX(0); }
  body.drawer-open #scrim { opacity:1; pointer-events:auto; }
  #drawer .dhead { display:flex; align-items:center; justify-content:space-between; background:#b3470f; color:#fff;
                   padding:.6rem .8rem; font-size:1.1rem; font-weight:bold; }
  #drawerClose { background:none; border:0; color:#fff; font-size:1.4rem; line-height:1; padding:.2rem .5rem; cursor:pointer; }
  #drawer .dbody { overflow-y:auto; overscroll-behavior:contain; padding:.7rem; flex:1; }
  #drawer a { display:block; padding:.7rem .8rem; color:inherit; text-decoration:none; border-radius:4px; }
  #drawer a.active { background:#f6d6b0; }
  input { width:100%; padding:.5rem; margin-bottom:1rem; box-sizing:border-box; }
  details { margin-bottom:.4rem; border-radius:6px; background:#fde9d2; }
  summary { cursor:pointer; padding:.5rem .7rem; font-weight:bold; color:#b3470f; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"▸ "; }
  details[open] summary::before { content:"▾ "; }
  summary .count { float:right; font-weight:normal; color:#7a5a3a; font-size:.85em; }
  details a { margin:0 .4rem; }
  details[open] { padding-bottom:.4rem; }
  nav a { display:block; padding:.3rem .5rem; color:inherit; text-decoration:none; border-radius:4px; }
  nav a:hover, nav a.active { background:#f6d6b0; }
  /* Home view: only the song index. Song view: index on top, lyrics below. */
  body.home main { display:none; }
  header { cursor:pointer; }
  #title { text-align:center; color:#b3470f; }
  #lyrics { color:#000; font-weight:700; -webkit-text-stroke:.35px currentColor; letter-spacing:.02em; word-spacing:.1em; font-size:1.25rem; line-height:1.8; text-align:center; padding-bottom:60vh; }
  #lyrics .line { white-space:pre-wrap; padding:0 .3rem; border-radius:4px; transition:background .3s; cursor:pointer; }
  #lyrics .line.cur { background:#fff1c9; }
  #lyrics .w { cursor:pointer; border-radius:3px; padding:0 .05em; transition:background .15s, color .15s; }
  #lyrics .w.done { color:#8f3307; }
  #lyrics .w.now { background:#ffc83d; color:#000; }
  #lyrics .gap { height:1em; }
  .toolbar { position:sticky; top:0; z-index:1; background:#fff7ec; padding:.5rem 0; display:flex; gap:.6rem;
             align-items:center; justify-content:center; flex-wrap:wrap; border-bottom:1px solid #f0d2ae; font-size:.9rem; }
  .toolbar button { padding:.4rem .8rem; border:0; border-radius:6px; background:#b3470f; color:#fff; cursor:pointer; font-size:1rem; }
  .toolbar button.on { background:#2e7d32; }
  .toolbar .mode { display:inline-flex; gap:.5rem; align-items:center; padding:.25rem .5rem;
                   border:1px solid #f0d2ae; border-radius:8px; background:#fffaf3; transition:opacity .2s; }
  .toolbar .mode.off { opacity:.35; filter:grayscale(1); cursor:not-allowed; }
  .toolbar .mode.off * { pointer-events:none; }
  #status { color:#7a5a3a; width:100%; text-align:center; }
  .note { color:#7a5a3a; font-style:italic; }
  /* Copy protection: no text selection anywhere except the search box. */
  body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input { -webkit-user-select:text; user-select:text; }
  @media print { body { display:none; } }

  /* ---------- Touch & mobile friendliness ---------- */
  html { -webkit-text-size-adjust:100%; }
  * { -webkit-tap-highlight-color:transparent; }
  input, select { font-size:16px; }               /* 16px stops iPhone zooming in on focus */
  button, select, summary, nav a { touch-action:manipulation; }
  .toolbar button.ghost { background:transparent; color:#b3470f; border:1px solid #e0b98f; }
  .toolbar select { padding:.3rem; border-radius:6px; border:1px solid #e0b98f; background:#fff; }
  .speed input { width:100px; margin:0; vertical-align:middle; }

  #tbHandle { display:none; }                     /* resize handle is only for the phone bottom bar */
  @media (max-width: 700px) {
    header { padding:.6rem calc(.6rem + env(safe-area-inset-right)) .6rem calc(.6rem + env(safe-area-inset-left)); }
    header h1 { font-size:1.1rem; }
    nav, main { padding:.6rem; }

    /* Bigger touch targets in the song list */
    summary { padding:.9rem .8rem; font-size:1.05rem; }
    nav a { padding:.75rem .9rem; font-size:1.05rem; }
    details a { margin:0 .3rem; }
    #q { padding:.7rem; border-radius:8px; border:1px solid #e0b98f; }

    #title { font-size:1.2rem; margin:.3rem 0 .8rem; }
    #lyrics { line-height:1.9; padding-bottom:calc(60vh + 140px); }

    /* Controls move to a bar at the bottom of the screen, within thumb reach */
    /* Everything in the bar is sized in "em", so one number (--tb, set by dragging the handle)
       scales the whole bar up or down. */
    .toolbar { position:fixed; top:auto; bottom:0; left:0; right:0;
               font-size:calc(15px * var(--tb, 1)); gap:.45em; padding:0 .4em .5em;
               padding-bottom:calc(.5em + env(safe-area-inset-bottom));
               border-top:1px solid #f0d2ae; border-bottom:0; box-shadow:0 -2px 8px rgba(0,0,0,.08); }
    /* Two compact rows: [A−  A+  🎤 Voice  lang]  /  [▶ Auto  speed] */
    .toolbar .mode { padding:0; gap:.35em; border:0; background:none; }
    .toolbar .long { display:none; }
    .toolbar .nav-mode { order:1; }
    #voiceMode { order:2; }
    #speedMode { order:3; flex:1 1 100%; justify-content:center; }
    #status { order:4; }
    #speedMode .speed { display:inline-flex; align-items:center; gap:.3em; flex:1; max-width:18em; }
    .speed input { flex:1; width:5em; height:1.6em; }
    .toolbar button { min-height:2.7em; padding:.35em .75em; font-size:1em; }
    .toolbar select { font-size:max(16px, 1em); padding:.3em .2em; }   /* ≥16px so iPhone doesn't zoom */
    .toolbar .lbl { display:none; }
    #status { font-size:.8em; min-height:0; }
    #status:empty { display:none; }

    /* Grab handle: drag up = bigger, drag down = smaller, tap = fold the bar away / back */
    #tbHandle { display:flex; order:0; flex:1 1 100%; justify-content:center; align-items:center;
                height:1.6em; margin:0 -.4em -.2em; cursor:ns-resize; touch-action:none; }
    #tbHandle::before { content:""; width:3em; height:.32em; border-radius:1em; background:#d9b48c; }
    .toolbar.folded { gap:0; padding-bottom:calc(.15em + env(safe-area-inset-bottom)); }
    .toolbar.folded > :not(#tbHandle) { display:none; }
    .toolbar.folded #tbHandle::after { content:"▲ tap to show controls"; margin-left:.6em; font-size:.75em; color:#b3470f; }
  }
  @media (max-width: 380px) {
    .toolbar { gap:.3em; padding-left:.25em; padding-right:.25em; }
    .toolbar button { padding:.3em .55em; }
    header h1 { font-size:1rem; }
  }
</style>
</head>
<body class="home">
<button id="toIndex" title="Show the song index">☰<br><span class="vt">Songs</span></button>
<div id="godBg"></div>
<div id="scrim"></div>
<aside id="drawer" aria-label="Song index">
  <div class="dhead"><span>☰ Songs</span><button id="drawerClose" title="Close">✕</button></div>
  <div class="dbody"><input id="dq" placeholder="Search songs..."><div id="dlist"></div></div>
</aside>
<header title="Back to song list"><h1>🙏 Swamiye Saranam Ayyappa — Bhajana Songs</h1></header>
<div class="wrap">
  <nav><input id="q" placeholder="Search songs..."><div id="list"></div></nav>
  <main>
    <div class="toolbar">
      <div id="tbHandle" title="Drag up: bigger. Drag down: smaller, then hide. Tap the small bar to show the controls again."></div>
      <span class="mode nav-mode">
        <button id="smaller" class="ghost" title="Smaller text">A−</button>
        <button id="bigger" class="ghost" title="Bigger text">A+</button>
      </span>
      <span class="mode" id="speedMode">
        <button id="auto">▶ Auto<span class="long">-scroll</span></button>
        <label class="speed" title="How fast the highlight moves (words per minute)"><span class="lbl">Speed</span>
          <input id="speed" type="range" min="15" max="150" value="50">
          <span id="speedVal">50</span>/min</label>
      </span>
      <span class="mode" id="voiceMode"><button id="voice">🎤 Voice<span class="long"> follow</span></button>
        <select id="vlang" title="Recognition language (try English if Telugu isn't picking up)">
          <option value="te-IN">Telugu</option>
          <option value="en-IN">English</option>
        </select></span>
      <div id="status"></div>
    </div>
    <h2 id="title">Select a song</h2><div id="lyrics"></div>
  </main>
</div>
<script src="songs.js"></script>
<script src="lyrics.js"></script>
<script>
const list = document.getElementById("list");
// Clean up pasted lyrics: trim each line, drop the blank line between every
// line (common when copying from websites), and keep one blank line between stanzas.
function formatLyrics(raw) {
  let lines = raw.replace(/\r/g, "").split("\n").map(l => l.trim());
  const filled = lines.filter(Boolean).length;
  const blanks = lines.length - filled;
  if (filled > 4 && blanks >= filled - 2) lines = lines.filter(Boolean);
  return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
let currentTitle = null;
function show(song, el) {
  document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));
  if (el) el.classList.add("active");
  document.getElementById("title").textContent = song.title;
  stopAuto();
  renderLyrics(formatLyrics((window.LYRICS || {})[song.title] || song.lyrics || ""));
  currentTitle = song.title;
  setGodBg(song.title);
  // Adds a history entry, so the phone's Back button returns to the song list.
  const h = "#" + encodeURIComponent(song.title);
  if (location.hash !== h) location.hash = h;
  document.body.classList.remove("home");
  // Lyrics sit below the index: scroll down so the song title is at the top of the screen.
  requestAnimationFrame(() => document.querySelector("main").scrollIntoView({ block: "start" }));
  updateToIndex();
  keepAwake(true);
}

// ---------- God picture behind the lyrics ----------
// Each category in songs.js has a "bg" key. If images/<bg>.jpg/.jpeg/.png/.webp exists it is used
// (a photo you add yourself); otherwise a simple built-in emblem is drawn for that deity.
const C = "#b3470f";
const svg = body => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="${C}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`);
const EMBLEMS = {
  // Vinayaka: Omkara inside a circle
  vinayaka: svg(`<circle cx="100" cy="100" r="88"/><circle cx="100" cy="100" r="78" stroke-width="1.5"/>
    <text x="100" y="138" font-size="118" text-anchor="middle" fill="${C}" stroke="none"
      font-family="Nirmala UI, Noto Sans Devanagari, Kohinoor Devanagari, sans-serif">ॐ</text>`),
  // Subramanya: the Vel (spear)
  subramanya: svg(`<path d="M100 12 C132 46 132 76 100 94 C68 76 68 46 100 12 Z"/>
    <path d="M100 32 C116 52 116 68 100 78 C84 68 84 52 100 32 Z" stroke-width="2.5"/>
    <path d="M100 94 V190"/><path d="M84 100 H116"/><circle cx="100" cy="58" r="5" fill="${C}"/>`),
  // Venkateswara: Tirunamam
  venkateswara: svg(`<path d="M62 28 V112 Q62 168 100 168 Q138 168 138 112 V28" stroke-width="13"/>
    <path d="M100 36 V150" stroke="#c62828" stroke-width="11"/><path d="M70 182 H130" stroke-width="3"/>`),
  // Shiva: Trishul with damaru
  shiva: svg(`<path d="M100 12 L109 58 H91 Z" fill="${C}"/><path d="M58 28 C58 66 78 80 100 80 C122 80 142 66 142 28"/>
    <path d="M100 58 V192"/><path d="M84 116 L116 116 L100 132 Z M84 148 L116 148 L100 132 Z" fill="${C}"/>
    <path d="M152 36 a18 18 0 1 0 22 26 a14 14 0 1 1 -22 -26 Z" fill="${C}" stroke="none"/>`),
  // Amma vaari: lotus with kumkum bindu
  amma: svg(`<path d="M100 62 C122 92 122 130 100 152 C78 130 78 92 100 62 Z"/>
    <path d="M100 152 C72 142 52 112 56 82 C80 96 96 122 100 152 Z"/><path d="M100 152 C128 142 148 112 144 82 C120 96 104 122 100 152 Z"/>
    <path d="M100 152 C62 152 32 134 24 112 C56 106 86 126 100 152 Z"/><path d="M100 152 C138 152 168 134 176 112 C144 106 114 126 100 152 Z"/>
    <path d="M38 168 H162" stroke-width="3"/><circle cx="100" cy="40" r="7" fill="#c62828" stroke="none"/>`),
  // Ayyappa: Sabarimala hill, the holy steps and Makara Jyothi
  ayyappa: svg(`<path d="M18 176 L100 64 L182 176 Z"/>
    ${[0,1,2,3,4,5,6,7,8].map(i => `<path d="M${72 + i*3} ${172 - i*9} H${128 - i*3}" stroke-width="2.5"/>`).join("")}
    <path d="M100 14 C113 30 111 43 100 50 C89 43 87 30 100 14 Z" fill="${C}"/>
    <path d="M100 4 V8 M78 22 L82 25 M122 22 L118 25 M72 42 H77 M128 42 H123" stroke-width="2.5"/>`),
};
const bgCache = {};
function findPhoto(key) {
  if (key in bgCache) return Promise.resolve(bgCache[key]);
  const tries = ["jpg", "jpeg", "png", "webp"].map(ext => `images/${key}.${ext}`);
  return new Promise(done => {
    const next = i => {
      if (i >= tries.length) { bgCache[key] = null; return done(null); }
      const img = new Image();
      img.onload = () => { bgCache[key] = tries[i]; done(tries[i]); };
      img.onerror = () => next(i + 1);
      img.src = tries[i];
    };
    next(0);
  });
}
let bgFor = null;
async function setGodBg(title) {
  const el = document.getElementById("godBg");
  const cat = CATEGORIES.find(c => c.songs.some(s => s.title === title));
  const key = cat && cat.bg;
  bgFor = key;
  el.classList.remove("ready", "photo");
  if (!key) return;
  const photo = await findPhoto(key);
  if (bgFor !== key) return;                           // another song was opened meanwhile
  el.style.backgroundImage = `url("${photo || EMBLEMS[key] || ""}")`;
  el.classList.toggle("photo", !!photo);
  el.style.setProperty("--bg-opacity", photo ? ".16" : ".12");
  el.classList.add("ready");
}

// ---------- Keep the phone screen on while a song is open (Screen Wake Lock API) ----------
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && "wakeLock" in navigator && document.visibilityState === "visible") {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
// The lock is dropped when the tab is hidden; take it again when the user comes back.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !document.body.classList.contains("home")) keepAwake(true);
});

// ---------- Text size (A− / A+), remembered on this device ----------
let fontSize = parseFloat(localStorage.getItem("bhajanaFont")) || 1.25;
function applyFont() { document.getElementById("lyrics").style.fontSize = fontSize + "rem"; }
function changeFont(d) {
  fontSize = Math.min(2.4, Math.max(0.9, +(fontSize + d).toFixed(2)));
  localStorage.setItem("bhajanaFont", fontSize);
  applyFont();
}
document.getElementById("smaller").onclick = () => changeFont(-0.15);
document.getElementById("bigger").onclick = () => changeFont(0.15);
applyFont();

// ---------- Phone bottom bar: drag the handle to resize or hide it ----------
//  • Drag up            → controls get bigger.
//  • Drag down a little → controls get smaller.
//  • Drag down further  → the bar slides away and becomes a small strip at the bottom.
//  • Tap the small strip (or drag it up) → the bar comes back.
// Size and hidden state are remembered on this device.
const toolbarEl = document.querySelector(".toolbar"), handle = document.getElementById("tbHandle");
let tbScale = parseFloat(localStorage.getItem("bhajanaBar")) || 1;
const TB_MIN = 0.7, TB_MAX = 1.6;
const HIDE_AFTER = 45;                                  // px dragged down past the smallest size
function applyBar() { toolbarEl.style.setProperty("--tb", tbScale); }
applyBar();
function setFolded(f) {
  toolbarEl.classList.toggle("folded", f);
  localStorage.setItem("bhajanaBarFolded", f ? "1" : "0");
}
if (localStorage.getItem("bhajanaBarFolded") === "1") toolbarEl.classList.add("folded");
let drag = null;
handle.addEventListener("pointerdown", e => {
  drag = { y: e.clientY, start: tbScale, moved: false, hide: false };
  try { handle.setPointerCapture(e.pointerId); } catch {}   // keep getting moves even if the finger leaves the handle
  e.preventDefault();
});
handle.addEventListener("pointermove", e => {
  if (!drag) return;
  const dy = drag.y - e.clientY;                        // positive = dragged up, negative = down
  if (Math.abs(dy) > 6) drag.moved = true;
  if (!drag.moved) return;
  if (toolbarEl.classList.contains("folded")) {          // small strip: a drag up brings the bar back
    if (dy > 20) { setFolded(false); drag = null; }
    return;
  }
  const wanted = drag.start + dy / 160;
  tbScale = Math.min(TB_MAX, Math.max(TB_MIN, +wanted.toFixed(3)));
  applyBar();
  // Dragging down beyond the smallest size: the bar follows the finger down, ready to hide.
  const past = Math.max(0, (TB_MIN - wanted) * 160);
  drag.hide = past > HIDE_AFTER;
  toolbarEl.style.transform = past ? `translateY(${Math.min(past, 120)}px)` : "";
  toolbarEl.style.opacity = past ? String(Math.max(0.35, 1 - past / 150)) : "";
});
function endDrag() {
  if (!drag) return;
  toolbarEl.style.transform = ""; toolbarEl.style.opacity = "";
  if (!drag.moved) {
    if (toolbarEl.classList.contains("folded")) setFolded(false);   // tap the small strip → bar comes back
  } else if (drag.hide) {
    tbScale = drag.start;                               // keep the size it had before hiding
    applyBar();
    setFolded(true);
  }
  localStorage.setItem("bhajanaBar", tbScale);
  drag = null;
}
handle.addEventListener("pointerup", endDrag);
handle.addEventListener("pointercancel", endDrag);

// ---------- Lyrics rendering (one <span> per word, so we can highlight word by word) ----------
let words = [];    // [{ el, key, line }]
let lineEls = [];  // line <div>s
// Phonetic "sound key" for a word, used to compare lyrics with what the speech recogniser hears.
// Works for Telugu script and romanised/English text alike: vowels, aspiration, retroflex vs
// dental, short vs long and doubled letters are all ignored, so బొజ్జ / బోజ్జ / bojja → "bj".
const TE = { "క":"k","ఖ":"k","గ":"g","ఘ":"g","ఙ":"n","చ":"c","ఛ":"c","జ":"j","ఝ":"j","ఞ":"n",
  "ట":"t","ఠ":"t","డ":"d","ఢ":"d","ణ":"n","త":"t","థ":"t","ద":"d","ధ":"d","న":"n",
  "ప":"p","ఫ":"p","బ":"b","భ":"b","మ":"m","య":"y","ర":"r","ఱ":"r","ల":"l","ళ":"l","ఴ":"l",
  "వ":"v","శ":"s","ష":"s","స":"s","హ":"h" };
function keyOf(w) {
  let out = "";
  if (/[ఀ-౿]/.test(w)) {
    const chars = [...w];
    chars.forEach((ch, i) => {
      if (TE[ch]) out += TE[ch];
      else if (ch === "ం") out += chars.slice(i + 1).some(c => TE[c]) ? "n" : "m";  // anusvara: n before a consonant, m at the end
    });
    if (/^[అ-ఔ]/.test(w)) out = "a" + out;             // word starts with a vowel letter
  } else {
    out = w.toLowerCase()
      .replace(/[^a-z]/g, "")
      .replace(/([kgcjtdpb])h/g, "$1").replace(/sh/g, "s")       // aspirates: bh→b, th→t, sh→s
      .replace(/w/g, "v").replace(/z/g, "j").replace(/f/g, "p").replace(/q/g, "k").replace(/x/g, "ks");
    const first = /^[aeiou]/.test(out) ? "a" : "";
    out = first + out.replace(/[aeiouy]+$/, "").replace(/[aeiou]/g, "");
  }
  return out.replace(/(.)\1+/g, "$1");                           // doubled letters: jj → j
}
const keys = t => t.split(/\s+/).map(keyOf).filter(Boolean);
// Similarity 0..1 between two sound keys (1 - edit distance / length).
function sim(a, b) {
  if (a === b) return 1;
  const m = a.length, n = b.length;
  if (!m || !n) return 0;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return 1 - prev[n] / Math.max(m, n);
}
function renderLyrics(text) {
  const l = document.getElementById("lyrics");
  l.innerHTML = ""; words = []; lineEls = []; auto.cur = -1;
  if (!text) { l.textContent = "Lyrics not added yet."; l.className = "note"; return; }
  l.className = "";
  text.split("\n").forEach(t => {
    const d = document.createElement("div");
    l.appendChild(d);
    if (!t) { d.className = "gap"; return; }
    d.className = "line";
    const li = lineEls.push(d) - 1;
    // Clicking a line (outside a word) starts following from the first word of that line.
    d.onclick = e => {
      if (e.target !== d) return;
      const first = words.findIndex(w => w.line === li);
      if (first >= 0) { setWord(first); auto.acc = 0; }
    };
    t.split(/(\s+)/).forEach(part => {
      if (!part) return;
      if (/^\s+$/.test(part)) { d.appendChild(document.createTextNode(part)); return; }
      const s = document.createElement("span");
      s.className = "w"; s.textContent = part; d.appendChild(s);
      const idx = words.push({ el: s, key: keyOf(part), line: li }) - 1;
      s.onclick = () => { setWord(idx); auto.acc = 0; };   // click a word to jump the highlight there
    });
  });
}

// Highlight word i: earlier words in the same line are "done", word i is "now".
function setWord(i) {
  i = Math.max(-1, Math.min(words.length - 1, i));
  const oldLine = auto.cur >= 0 ? words[auto.cur].line : -1;
  document.querySelectorAll("#lyrics .w.now, #lyrics .w.done, #lyrics .line.cur")
    .forEach(e => e.classList.remove("now", "done", "cur"));
  auto.cur = i;
  if (i < 0) return;
  const line = words[i].line;
  lineEls[line].classList.add("cur");
  for (let k = i; k >= 0 && words[k].line === line; k--) words[k].el.classList.add(k === i ? "now" : "done");
  if (line !== oldLine) {
    const el = lineEls[line];
    window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - innerHeight * 0.35, behavior: "smooth" });
  }
}

// ---------- Two independent follow modes (only one runs at a time) ----------
// 1) Auto-scroll: timer only, no microphone. The highlight moves word by word at the chosen speed.
// 2) Voice follow: speech recognition only (Chrome/Edge, needs internet). The highlight moves
//    to the word it recognises; nothing moves on its own.
const speedBtn = document.getElementById("auto"), voiceBtn = document.getElementById("voice");
const statusEl = document.getElementById("status"), speedEl = document.getElementById("speed");
const auto = { mode: null, raf: 0, rec: null, cur: -1, acc: 0 };
const setStatus = s => statusEl.textContent = s;
speedEl.oninput = () => document.getElementById("speedVal").textContent = speedEl.value;
speedBtn.onclick = () => auto.mode === "speed" ? stopAuto() : startSpeed();
voiceBtn.onclick = () => auto.mode === "voice" ? stopAuto() : startVoice();

// While one mode runs, the other mode's controls are dimmed and disabled.
function lockOther(mode) {
  const groups = { speed: document.getElementById("speedMode"), voice: document.getElementById("voiceMode") };
  for (const [name, el] of Object.entries(groups)) {
    const off = mode !== null && name !== mode;
    el.classList.toggle("off", off);
    el.querySelectorAll("button, input, select").forEach(c => c.disabled = off);
    el.title = off ? "Stop the other mode first" : "";
  }
}

function begin(mode) {
  stopAuto();
  if (!words.length) { setStatus("No lyrics to follow."); return false; }
  auto.mode = mode; auto.acc = 0;
  if (auto.cur < 0 || auto.cur >= words.length - 1) setWord(0);
  lockOther(mode);
  return true;
}

// ----- Mode 1: Auto-scroll with speed -----
function startSpeed() {
  if (!begin("speed")) return;
  speedBtn.innerHTML = "⏸ Pause"; speedBtn.classList.add("on");
  setStatus("Auto-scrolling at the selected speed. Click any word to jump there.");
  let last = performance.now();
  const tick = now => {
    if (auto.mode !== "speed") return;
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    auto.acc += speedEl.value / 60 * dt;
    if (auto.acc >= 1) {
      auto.acc -= 1;
      if (auto.cur >= words.length - 1) { stopAuto(); setStatus("End of song."); return; }
      setWord(auto.cur + 1);
    }
    auto.raf = requestAnimationFrame(tick);
  };
  auto.raf = requestAnimationFrame(tick);
}

// ----- Mode 2: Auto-scroll with voice recognition -----
const voice = { misses: 0, lastMatch: 0, restartTimer: 0 };
// Explains why the microphone can't be used, in plain words for phone users.
const MIC_HELP = {
  insecure: "Voice follow needs the site to be opened from a secure https:// address " +
            "(e.g. your vercel.app link). Phones block the microphone on file:// and http:// pages.",
  blocked: "Microphone is blocked for this site. Tap the lock / ⓘ icon next to the address bar → " +
           "Permissions → Microphone → Allow, then reload. (Android: also check Settings → Apps → " +
           "Chrome → Permissions → Microphone.)",
  nomic: "No microphone was found on this device.",
  busy: "The microphone is being used by another app (call, recorder…). Close it and try again.",
  unsupported: "This browser can't do speech recognition. On Android use Chrome; on iPhone use Safari.",
  network: "Voice follow needs an internet connection (speech is recognised online).",
  service: "Speech recognition is turned off or not available in this browser. " +
           "Try Chrome (Android) or Safari (iPhone), and check that Google / Siri speech is enabled.",
  iosService: "Speech recognition is switched off on this iPhone. Turn on Settings → General → Keyboard → " +
              "Enable Dictation (and allow Siri & Dictation in Settings → Screen Time → Content & Privacy " +
              "Restrictions → Allowed Apps), then reload the page.",
  teluguIOS: "This iPhone can't recognise Telugu speech, so the language has been switched to English. " +
             "Tap 🎤 Voice again. (If it still fails: Settings → General → Keyboard → Enable Dictation.)",
  language: "Telugu speech recognition isn't available here, so the language has been switched to English. " +
            "Tap 🎤 Voice again.",
  iosPaused: "iPhone stopped listening. Tap 🎤 Voice to carry on from the highlighted word.",
};
// iPhone / iPad (all iOS browsers use Safari's engine; iPadOS reports itself as a Mac with touch).
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

// Remember the chosen recognition language on this device.
const vlangEl = document.getElementById("vlang");
if (localStorage.getItem("bhajanaVoiceLang")) vlangEl.value = localStorage.getItem("bhajanaVoiceLang");
vlangEl.onchange = () => localStorage.setItem("bhajanaVoiceLang", vlangEl.value);
function switchToEnglish() { vlangEl.value = "en-IN"; localStorage.setItem("bhajanaVoiceLang", "en-IN"); }

// Ask for the microphone directly: this is what makes the browser show the "Allow microphone?" pop-up.
// (Some phones never show it when only speech recognition asks.)
async function askMicrophone() {
  if (!window.isSecureContext) return "insecure";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return "insecure";
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: true });
    s.getTracks().forEach(t => t.stop());            // release it; speech recognition opens its own
    return null;
  } catch (e) {
    if (e.name === "NotAllowedError" || e.name === "SecurityError") return "blocked";
    if (e.name === "NotFoundError" || e.name === "OverconstrainedError") return "nomic";
    if (e.name === "NotReadableError" || e.name === "AbortError") return "busy";
    return "blocked";
  }
}

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setStatus(MIC_HELP.unsupported); return; }
  if (!words.length) { setStatus("No lyrics to follow."); return; }
  if (!window.isSecureContext) { setStatus(MIC_HELP.insecure); return; }
  // iPhone (Safari): recognition must start directly inside the tap - waiting for anything first
  // makes Safari refuse ("service-not-allowed"). Safari shows its own microphone pop-up.
  if (IS_IOS) { startRecognizer(SR); return; }
  // Android / desktop: ask for the microphone first, so the "Allow microphone?" pop-up appears.
  if (voice.asking) return;                            // ignore double taps while the pop-up is open
  voice.asking = true;
  setStatus("Asking for microphone permission…");
  askMicrophone().then(problem => {
    voice.asking = false;
    if (problem) setStatus(MIC_HELP[problem]); else startRecognizer(SR);
  });
}

function startRecognizer(SR) {
  if (!begin("voice")) return;
  voiceBtn.innerHTML = "⏹ Stop<span class=\"long\"> voice</span>"; voiceBtn.classList.add("on");
  voice.misses = 0; voice.lastMatch = performance.now(); voice.started = false; voice.heard = false;
  const r = new SR();
  r.lang = vlangEl.value;
  r.continuous = true; r.interimResults = true; r.maxAlternatives = IS_IOS ? 1 : 5;
  r.onstart = () => { voice.started = true; };
  r.onresult = e => {
    voice.heard = true;
    // Use the latest result plus the one before it (more context), and try every alternative.
    const last = e.results[e.results.length - 1];
    const before = e.results.length > 1 ? e.results[e.results.length - 2][0].transcript : "";
    let best = null;
    for (let a = 0; a < last.length; a++) {
      const m = findMatch(keys(before + " " + last[a].transcript).slice(-8));
      if (m && (!best || m.score > best.score)) best = m;
    }
    const heardText = last[0].transcript.trim().split(/\s+/).slice(-6).join(" ");
    if (best) {
      voice.misses = 0; voice.lastMatch = performance.now();
      if (best.index !== auto.cur) setWord(best.index);
      setStatus("✓ Heard: " + heardText);
    } else {
      if (last.isFinal) voice.misses++;
      setStatus("Heard: " + heardText + "  (no match yet)");
    }
  };
  r.onerror = e => {
    const telugu = r.lang.startsWith("te");
    let why = null;
    if (e.error === "language-not-supported") {
      if (telugu) { switchToEnglish(); why = IS_IOS ? "teluguIOS" : "language"; } else why = "service";
    } else if (e.error === "service-not-allowed") {
      // On iPhone this usually means Telugu isn't supported, or Dictation is switched off.
      if (IS_IOS && telugu && !voice.heard) { switchToEnglish(); why = "teluguIOS"; }
      else why = IS_IOS ? "iosService" : "service";
    } else if (e.error === "not-allowed") {
      // iPhone refuses automatic restarts that don't come from a tap.
      why = IS_IOS && voice.heard ? "iosPaused" : "blocked";
    } else if (e.error === "network") why = "network";
    else if (e.error === "audio-capture") why = "nomic";
    if (why) { stopAuto(); setStatus(MIC_HELP[why]); }
    // "no-speech" / "aborted" are normal during pauses: onend restarts listening.
  };
  // Chrome and Safari end recognition after silence or a while; restart after a short delay.
  // If the browser refuses (iPhone sometimes does), stop and ask for a tap to continue.
  r.onend = () => {
    if (auto.mode !== "voice" || auto.rec !== r) return;
    clearTimeout(voice.restartTimer);
    voice.restartTimer = setTimeout(() => {
      if (auto.rec !== r) return;
      try { r.start(); }
      catch { stopAuto(); setStatus(IS_IOS ? MIC_HELP.iosPaused : "Listening stopped. Tap 🎤 Voice to continue."); }
    }, 250);
  };
  auto.rec = r;
  try { r.start(); setStatus("Listening… start singing."); }
  catch { stopAuto(); setStatus(IS_IOS ? MIC_HELP.iosService : "Could not start voice recognition."); }
}

// Fuzzy local alignment (Smith-Waterman style) of the heard words against the lyrics.
// Returns { index, score } of the lyric word where the heard phrase ends, or null.
// Searches near the current word first; if that keeps failing (or we're lost), the whole song.
// People read top to bottom, so the highlight only ever moves FORWARD: from the current word
// to the end of the next 2 lines. It never goes back. (Click any line to restart from there.)
const LINES_AHEAD = 2;
function findMatch(heard) {
  if (heard.length < 2 || !words.length) return null;
  const from = Math.max(0, auto.cur);
  const curLine = words[from].line;
  let to = from;
  while (to < words.length && words[to].line <= curLine + LINES_AHEAD) to++;
  const m = alignIn(heard, from, to);
  return m && m.index > auto.cur ? m : null;
}

function alignIn(heard, from, to) {
  // Only lyric words that have a sound key take part (skips markers like "|2|" or "(").
  const idx = [];
  for (let k = from; k < to; k++) if (words[k].key) idx.push(k);
  const n = heard.length, W = idx.length;
  if (!W) return null;
  const GAP = 0.45, MATCH_MIN = 0.55;
  const L = j => words[idx[j - 1]].key;
  let prev2 = null, prev = new Float32Array(W + 1), best = null;
  for (let i = 1; i <= n; i++) {
    const cur = new Float32Array(W + 1);
    for (let j = 1; j <= W; j++) {
      let s = sim(heard[i - 1], L(j));
      let diag = prev[j - 1] + (s >= MATCH_MIN ? s : -0.6);
      // The recogniser may split one lyric word into two, or join two into one.
      if (i >= 2) {
        const s2 = sim(heard[i - 2] + heard[i - 1], L(j));
        if (s2 >= MATCH_MIN && prev2[j - 1] + 2 * s2 > diag) { diag = prev2[j - 1] + 2 * s2; s = s2; }
      }
      if (j >= 2) {
        const s2 = sim(heard[i - 1], L(j - 1) + L(j));
        if (s2 >= MATCH_MIN && prev[j - 2] + 2 * s2 > diag) { diag = prev[j - 2] + 2 * s2; s = s2; }
      }
      cur[j] = Math.max(0, diag, prev[j] - GAP, cur[j - 1] - GAP);
      // Only accept alignments that reach the last (or second-last) heard word: that's "now".
      if (i >= n - 1 && s >= MATCH_MIN && cur[j] === diag) {
        const word = idx[j - 1], dist = word - auto.cur;
        // Prefer just ahead of the current word (choruses repeat); jumping back costs more.
        const score = cur[j] - (dist >= 0 ? 0.004 * dist : 0.03 * -dist) - (i === n ? 0 : 0.3);
        if (!best || score > best.score) best = { index: word, score, raw: cur[j] };
      }
    }
    prev2 = prev; prev = cur;
  }
  // Need roughly two good word matches; going backwards needs stronger evidence.
  if (!best) return null;
  const need = best.index < auto.cur ? 2.4 : 1.4;
  return best.raw >= need ? best : null;
}

function stopAuto() {
  auto.mode = null;
  cancelAnimationFrame(auto.raf);
  if (auto.rec) { const r = auto.rec; auto.rec = null; try { r.abort(); } catch {} }
  speedBtn.innerHTML = "▶ Auto<span class=\"long\">-scroll</span>"; speedBtn.classList.remove("on");
  voiceBtn.innerHTML = "🎤 Voice<span class=\"long\"> follow</span>"; voiceBtn.classList.remove("on");
  lockOther(null);
  setStatus("");
}

function goHome() {
  stopAuto();
  keepAwake(false);
  currentTitle = null;
  document.body.classList.add("home");
  document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));
  if (location.hash) history.replaceState(null, "", location.pathname);
  window.scrollTo(0, 0);
  updateToIndex();
}
document.querySelector("header").onclick = goHome;

// "Songs" tab (middle of the left edge): visible while a song is open and the index has scrolled
// out of view. Tapping it slides the song index out as a drawer; picking a song closes it.
const navEl = document.querySelector("nav");
function updateToIndex() {
  const indexVisible = navEl.getBoundingClientRect().bottom > 40;   // any of the index still on screen
  document.body.classList.toggle("show-to-index", !document.body.classList.contains("home") && !indexVisible);
}
window.addEventListener("scroll", updateToIndex, { passive: true });
window.addEventListener("resize", updateToIndex);
const dq = document.getElementById("dq");
function openDrawer() {
  buildIndex(document.getElementById("dlist"), dq.value, true);
  document.body.classList.add("drawer-open");
}
function closeDrawer() { document.body.classList.remove("drawer-open"); }
document.getElementById("toIndex").onclick = openDrawer;
document.getElementById("drawerClose").onclick = closeDrawer;
document.getElementById("scrim").onclick = closeDrawer;
dq.oninput = () => buildIndex(document.getElementById("dlist"), dq.value, true);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

// Open the song named in the URL (#Song Title), or the list if there is none.
// Runs on start-up and whenever the URL changes (e.g. the phone's Back button).
function route() {
  const t = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
  if (!t) { if (!document.body.classList.contains("home")) goHome(); return; }
  if (t === currentTitle) return;
  const song = CATEGORIES.flatMap(c => c.songs).find(s => s.title === t);
  if (!song) { goHome(); return; }
  const link = [...document.querySelectorAll("nav a")].find(a => a.textContent === t);
  show(song, link);
}
window.addEventListener("hashchange", route);
function render(filter = "") { buildIndex(list, filter, false); }
// Builds the category drop-downs into `container` (the main index, or the drawer).
// In the drawer, the current song's category starts open and picking a song closes the drawer.
function buildIndex(container, filter = "", inDrawer) {
  container.innerHTML = "";
  const f = filter.toLowerCase();
  CATEGORIES.forEach(c => {
    const songs = c.songs.filter(s => s.title.toLowerCase().includes(f));
    if (!songs.length) return;
    const group = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = c.name;
    const count = document.createElement("span"); count.className = "count"; count.textContent = songs.length;
    sum.appendChild(count);
    group.appendChild(sum);
    if (f) group.open = true; // expand all matches while searching
    if (inDrawer && songs.some(s => s.title === currentTitle)) group.open = true;
    songs.forEach(s => {
      const a = document.createElement("a"); a.href = "#"; a.textContent = s.title;
      a.onclick = e => {
        e.preventDefault();
        if (inDrawer) {
          closeDrawer();
          // Highlight the song in the main index too.
          show(s, [...list.querySelectorAll("a")].find(x => x.textContent === s.title));
        } else show(s, a);
      };
      if (s.title === currentTitle) a.classList.add("active");
      group.appendChild(a);
    });
    container.appendChild(group);
  });
}
document.getElementById("q").oninput = e => render(e.target.value);

// ---------- Start: build the song index and open the song in the URL (if any) ----------
render();
route();

// ---------- Copy protection (allowed only inside the search box) ----------
const inSearch = e => e.target && e.target.tagName === "INPUT";   // search box and password box
["copy", "cut", "contextmenu", "selectstart", "dragstart"].forEach(type =>
  document.addEventListener(type, e => { if (!inSearch(e)) e.preventDefault(); }));
document.addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey) || inSearch(e)) return;
  const k = e.key.toLowerCase();
  if (["c", "x", "a", "s", "p", "u"].includes(k)) e.preventDefault();   // copy, cut, select all, save, print, view source
});
</script>
</body>
</html>
